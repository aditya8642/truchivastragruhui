<div class="container auth-page">
  <div class="auth-card card">
    <span class="eyebrow">Join Vastragruh</span>
    <h1>Create an account</h1>

    <form (ngSubmit)="submit()">
      <div class="field-row">
        <div class="field">
          <label for="firstName">First name</label>
          <input id="firstName" name="firstName" [(ngModel)]="firstName" required />
        </div>
        <div class="field">
          <label for="lastName">Last name</label>
          <input id="lastName" name="lastName" [(ngModel)]="lastName" required />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" required />
      </div>

      <div class="field">
        <label for="mobile">Mobile</label>
        <input id="mobile" name="mobile" [(ngModel)]="mobile" required pattern="^[6-9]\d{9}$"
               placeholder="10-digit number starting 6-9" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" required minlength="8" maxlength="20" />
      </div>

      @if (errorMessage()) {
        <p class="error-text">{{ errorMessage() }}</p>
      }
      @if (successMessage()) {
        <p class="success-text">{{ successMessage() }}</p>
      }

      <button type="submit" class="btn full-width" [disabled]="loading()">
        {{ loading() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="switch-link">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</div>
