<header class="navbar">
  <div class="container navbar-inner">
    <a routerLink="/products" class="wordmark">
      <img src="https://res.cloudinary.com/wvc3u0wy/image/upload/v1784371975/fashion-store/abgcjnn66anffnnyksi4.jpg" alt="Vastragruh logo" />
    </a>

    <nav class="nav-links">
      <a routerLink="/products" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">All</a>
      <ng-container *ngFor="let category of categories()">
        <a
          [routerLink]="['/products']"
          [queryParams]="{ category: category.id }"
          routerLinkActive="active"
        >
          {{ category.name }}
        </a>
      </ng-container>
    </nav>

    <div class="nav-actions">
      <ng-container *ngIf="auth.currentUser() as user">
        <div class="user-area">
          <div class="user-greeting" aria-live="polite">
            <div class="avatar-wrapper" tabindex="0" (click)="toggleDropdown($event)" (keydown.enter)="toggleDropdown($event)">
              <span class="avatar" title="{{ auth.displayName() }}" aria-hidden="true">{{ auth.displayName() | slice:0:1 | uppercase }}</span>
              <div class="avatar-caret" aria-hidden="true">▾</div>

              <div class="avatar-dropdown" *ngIf="dropdownOpen()" role="menu">
                <a class="dropdown-item" routerLink="/account" (click)="closeDropdown()">Profile</a>
                <a class="dropdown-item" routerLink="/orders" (click)="closeDropdown()">Orders</a>
                <button type="button" class="dropdown-item" (click)="logout()">Logout</button>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-container *ngIf="!auth.currentUser()">
        <a routerLink="/login" class="btn-outline">Log in</a>
      </ng-container>

      <a routerLink="/cart" class="cart-link">
        Cart
        <ng-container *ngIf="cart.itemCount() > 0">
          <span class="cart-count">{{ cart.itemCount() }}</span>
        </ng-container>
      </a>
    </div>
  </div>
</header>
