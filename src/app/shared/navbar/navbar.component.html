<header class="navbar">
  <div class="container navbar-inner">
    <a routerLink="/products" class="wordmark">
      <img src="https://res.cloudinary.com/wvc3u0wy/image/upload/v1784371975/fashion-store/abgcjnn66anffnnyksi4.jpg" alt="Vastragruh logo" />
    </a>

    <nav class="nav-links">
      <a routerLink="/products" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">All</a>
      @for (category of categories(); track category.id) {
        <a
          [routerLink]="['/products']"
          [queryParams]="{ category: category.id }"
          routerLinkActive="active"
        >
          {{ category.name }}
        </a>
      }
    </nav>

    <div class="nav-actions">
      @if (auth.currentUser(); as user) {
        <div class="user-area">
          <a routerLink="/orders" class="btn-outline">My orders</a>

            <div class="user-greeting" aria-live="polite">
              <div class="avatar-wrapper" (click)="toggleDropdown($event)" tabindex="0" (blur)="closeDropdown()">
                <span class="avatar" title="{{ auth.displayName() }}" aria-hidden="true">{{ auth.displayName() | slice:0:1 | uppercase }}</span>
                <div class="avatar-caret" aria-hidden="true">▾</div>

                <div class="avatar-dropdown" [class.open]="dropdownOpen()" role="menu" *if="dropdownOpen()">
                  <a class="dropdown-item" routerLink="/profile" (click)="closeDropdown()">Profile</a>
                  <a class="dropdown-item" routerLink="/orders" (click)="closeDropdown()">Orders</a>
                  <button class="dropdown-item" (click)="logout()">Logout</button>
                </div>
              </div>
            </div>

          <button class="btn-outline logout-btn" (click)="logout()">Log out</button>
        </div>
      } @else {
        <a routerLink="/login" class="btn-outline">Log in</a>
      }

      <a routerLink="/cart" class="cart-link">
        Cart
        @if (cart.itemCount() > 0) {
          <span class="cart-count">{{ cart.itemCount() }}</span>
        }
      </a>
    </div>
  </div>
</header>
